
<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8"> 

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Admin QRR — Royaume des Ombres</title>

<style>

body {
    margin: 0;
    padding: 30px;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
}

h1 {
    color: #b000ff;
}

.qrr {
    background: #151515;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 20px;
    margin: 20px 0;
}

.label {
    color: #aaa;
    font-size: 14px;
}

.reponse {
    background: #0d0d0d;
    padding: 15px;
    border-radius: 8px;
    margin-top: 8px;
}

button {
    background: #b000ff;
    color: white;
    border: none;
    padding: 12px 18px;
    border-radius: 8px;
    cursor: pointer;
}

button:hover {
    background: #d000ff;
}

#message {
    margin: 20px 0;
    color: #aaa;
}

</style>

</head>

<body>

<h1>🌑 Royaume des Ombres — Admin QRR</h1>

<p id="message">
Chargement des réponses...
</p>

<div id="listeQRR"></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://dkdwqqujpsbjqjmfgzxu.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_EKQTBx_F7E8kufwAVh2sAA_u1MSl8dw";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


async function chargerQRR() {

    const message =
        document.getElementById("message");

    const liste =
        document.getElementById("listeQRR");


    const { data, error } =
        await supabaseClient
            .from("reponses_qrr")
            .select("*")
            .order("id", {
                ascending: false
            });


    if (error) {

        console.error(error);

        message.textContent =
            "⚠️ Impossible de charger les QRR.";

        return;
    }


    if (!data || data.length === 0) {

        message.textContent =
            "Aucune QRR enregistrée pour le moment.";

        return;
    }


    message.textContent =
        data.length +
        " réponse(s) trouvée(s).";


    data.forEach(qrr => {

    const bloc =
        document.createElement("div");

    bloc.className = "qrr";


    bloc.innerHTML = `

        <div class="label">
            Joueur
        </div>

        <strong>
            ${qrr.joueur || "Inconnu"}
        </strong>

        <br><br>


        <div class="label">
            Boss
        </div>

        <strong>
            ${qrr.boss || "Inconnu"}
        </strong>

        <br><br>


        <div class="label">
            Question
        </div>

        <div class="reponse">
            ${qrr.question || ""}
        </div>

        <br>


        <div class="label">
            Réponse du joueur
        </div>

        <div class="reponse">
            ${qrr.reponse || ""}
        </div>

        <br>


        <div class="label">
            Points maximum
        </div>

        <strong>
            ${qrr.points_max}
        </strong>

        <br><br>


        <div class="label">
            Points obtenus
        </div>

        <input
            type="number"
            class="points-input"
            min="0"
            max="${qrr.points_max}"
            value="${qrr.points_obtenus ?? ""}"
            placeholder="0 à ${qrr.points_max}"
        >

        <br><br>


        <div class="label">
            Correction
        </div>

        <textarea
            class="correction-input"
            placeholder="Écris la correction ici..."
        >${qrr.correction_ia ?? ""}</textarea>

        <br><br>


        <strong>
            Statut :
            ${qrr.statut || "à corriger"}
        </strong>
<br><br>

<div class="label">
    Correction
</div>

<textarea id="correction-${qrr.id}" placeholder="Écris la correction ici..."></textarea>

<br>

<input 
id="points-${qrr.id}" 
type="number" 
placeholder="Points obtenus">

<br><br>

<button onclick="corrigerQRR(${qrr.id})">
    ✅ Valider correction
</button>
        <br><br>


        <button
            class="corriger-btn"
            type="button"
        >
            ✅ Enregistrer la correction
        </button>

    `;


    const pointsInput =
        bloc.querySelector(".points-input");

    const correctionInput =
        bloc.querySelector(".correction-input");

    const corrigerBtn =
        bloc.querySelector(".corriger-btn");


    corrigerBtn.addEventListener(
        "click",
        async () => {

            const points =
                Number(pointsInput.value);

            const correction =
                correctionInput.value.trim();


            if (
                !Number.isFinite(points) ||
                points < 0 ||
                points > qrr.points_max
            ) {

                alert(
                    "⚠️ Les points doivent être compris entre 0 et " +
                    qrr.points_max
                );

                return;
            }


            const { error } =
                await supabaseClient
                    .from("reponses_qrr")
                    .update({

                        points_obtenus: points,

                        correction_ia: correction,

                        statut: "corrigé"

                    })
                    .eq("id", qrr.id);


            if (error) {

                console.error(
                    "Erreur correction :",
                    error
                );

                alert(
                    "❌ Impossible d'enregistrer la correction."
                );

                return;
            }


            alert(
                "✅ Correction enregistrée !"
            );


            qrr.points_obtenus =
                points;

            qrr.correction_ia =
                correction;

            qrr.statut =
                "corrigé";


            corrigerBtn.textContent =
                "✅ Corrigé";

        
    );


    liste.appendChild(bloc);

});
    

}


chargerQRR();
async function corrigerQRR(id) {

    const correction =
        document.getElementById(`correction-${id}`).value;

    const points =
        document.getElementById(`points-${id}`).value;


    if (!correction || points === "") {

        alert("Écris une correction et un nombre de points.");

        return;

    }


    const { error } =
        await supabaseClient
        .from("reponses_qrr")
        .update({

            correction_ia: correction,

            points_obtenus: Number(points),

            statut: "corrigée"

        })
        .eq("id", id);


    if (error) {

        console.error(
            "Erreur Supabase :",
            error
        );

        alert("Erreur lors de la correction.");

        return;

    }


    alert("✅ Correction enregistrée !");


    location.reload();

}
</script>

</body>

</html>
