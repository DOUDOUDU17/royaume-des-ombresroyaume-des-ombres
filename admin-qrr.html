
<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8"> 

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Admin QRR — Royaume des Ombres</title>

<style>

body {
    margin: 0;
    padding: 30px;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
}

h1 {
    color: #b000ff;
}

.qrr {
    background: #151515;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 20px;
    margin: 20px 0;
}

.label {
    color: #aaa;
    font-size: 14px;
}

.reponse {
    background: #0d0d0d;
    padding: 15px;
    border-radius: 8px;
    margin-top: 8px;
}

button {
    background: #b000ff;
    color: white;
    border: none;
    padding: 12px 18px;
    border-radius: 8px;
    cursor: pointer;
}

button:hover {
    background: #d000ff;
}

#message {
    margin: 20px 0;
    color: #aaa;
}

</style>

</head>

<body>

<h1>🌑 Royaume des Ombres — Admin QRR</h1>

<p id="message">
Chargement des réponses...
</p>

<div id="listeQRR"></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://dkdwqqujpsbjqjmfgzxu.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_EKQTBx_F7E8kufwAVh2sAA_u1MSl8dw";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


async function chargerQRR() {

    const message =
        document.getElementById("message");

    const liste =
        document.getElementById("listeQRR");


    const { data, error } =
        await supabaseClient
            .from("reponses_qrr")
            .select("*")
            .order("id", {
                ascending: false
            });


    if (error) {

        console.error(error);

        message.textContent =
            "⚠️ Impossible de charger les QRR.";

        return;
    }


    if (!data || data.length === 0) {

        message.textContent =
            "Aucune QRR enregistrée pour le moment.";

        return;
    }


    message.textContent =
        data.length +
        " réponse(s) trouvée(s).";


    data.forEach(qrr => {

        const bloc =
            document.createElement("div");

        bloc.className = "qrr";


        bloc.innerHTML = `

            <div class="label">
                Joueur
            </div>

            <strong>
                ${qrr.joueur || "Inconnu"}
            </strong>

            <br><br>


            <div class="label">
                Boss
            </div>

            <strong>
                ${qrr.boss || "Inconnu"}
            </strong>

            <br><br>


            <div class="label">
                Question
            </div>

            <div class="reponse">
                ${qrr.question || ""}
            </div>

            <br>


            <div class="label">
                Réponse du joueur
            </div>

            <div class="reponse">
                ${qrr.reponse || ""}
            </div>

            <br>


            <div class="label">
                Statut
            </div>

            <strong>
                ${qrr.statut || "à corriger"}
            </strong>

        `;


        liste.appendChild(bloc);

    });

}


chargerQRR();

</script>

</body>

</html>
