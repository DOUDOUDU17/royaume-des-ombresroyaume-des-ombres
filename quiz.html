<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quiz — Royaume des Ombres</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    background:
        radial-gradient(circle at top, #35105c, #12051f 45%, #05020a);
}

.container {
    width: 90%;
    max-width: 850px;
    margin: auto;
    padding: 30px 0;
}

.header {
    text-align: center;
    margin-bottom: 25px;
}

.header h1 {
    margin: 0;
    font-size: 35px;
}

.header p {
    color: #c9a7ff;
}

.timer-box {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 20px;
}

.timer {
    flex: 1;
    padding: 15px;
    text-align: center;
    border: 1px solid #7135a5;
    border-radius: 12px;
    background: rgba(20, 5, 35, 0.9);
}

.timer strong {
    display: block;
    margin-top: 6px;
    font-size: 25px;
    color: #e0b7ff;
}

.progress {
    margin-bottom: 20px;
    text-align: center;
    color: #c9a7ff;
}

.question-box {
    padding: 25px;
    border-radius: 18px;
    background: rgba(15, 5, 25, 0.95);
    border: 1px solid #63318c;
    box-shadow: 0 0 25px rgba(120, 40, 180, 0.25);
}

.type {
    display: inline-block;
    padding: 6px 10px;
    border-radius: 8px;
    background: #35105c;
    color: #d9b8ff;
    font-size: 13px;
    margin-bottom: 15px;
}

.question {
    font-size: 22px;
    line-height: 1.5;
    margin-bottom: 20px;
}

.answers {
    display: grid;
    gap: 12px;
}

.answer {
    width: 100%;
    padding: 15px;
    border: 1px solid #63318c;
    border-radius: 10px;
    background: #170821;
    color: white;
    text-align: left;
    font-size: 16px;
    cursor: pointer;
    transition: 0.2s;
}

.answer:hover {
    background: #291039;
    transform: translateX(3px);
}

.answer.selected {
    background: #54247a;
    border-color: #b76cff;
}

.answer.locked {
    opacity: 0.5;
    cursor: not-allowed;
}

.qrr-area {
    display: none;
}

.qrr-area textarea {
    width: 100%;
    min-height: 150px;
    resize: vertical;
    padding: 15px;
    border-radius: 10px;
    border: 1px solid #63318c;
    background: #0c0312;
    color: white;
    font-size: 16px;
}

.validate {
    margin-top: 12px;
    padding: 12px 20px;
    border: none;
    border-radius: 10px;
    background: #7135a5;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.validate:hover {
    background: #8e46c7;
}

.message {
    margin-top: 20px;
    text-align: center;
    color: #d8b8ff;
}

.navigation {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    margin-top: 20px;
}

.nav-btn {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #32104f;
    color: white;
    cursor: pointer;
}

.nav-btn:hover {
    background: #4d1974;
}

.nav-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.end-box {
    display: none;
    text-align: center;
    padding: 30px;
    border-radius: 18px;
    background: rgba(15, 5, 25, 0.95);
    border: 1px solid #7135a5;
}

.end-box h2 {
    color: #d6a6ff;
}

.back {
    display: inline-block;
    margin-top: 20px;
    color: #d0a5ff;
    text-decoration: none;
}

@media (max-width: 600px) {
    .timer-box {
        flex-direction: column;
    }

    .question {
        font-size: 19px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>☠️ QUIZ</h1>
        <p id="bossTitle">🌑 Boss des Ombres</p>
    </div>

    <div class="timer-box">

        <div class="timer">
            ⏱️ Temps global
            <strong id="globalTimer">05:00</strong>
        </div>

        <div class="timer">
            ⚡ Temps question
            <strong id="questionTimer">15</strong>
        </div>

    </div>

    <div class="progress" id="progress">
        Question 1 / 5
    </div>

    <div class="question-box" id="quizBox">

        <div class="type" id="questionType">
            QCM
        </div>

        <div class="question" id="questionText"></div>

        <div class="answers" id="answers"></div>

        <div class="qrr-area" id="qrrArea">

            <textarea
                id="qrrAnswer"
                placeholder="Écris ta réponse ici..."
            ></textarea>

            <button class="validate" onclick="submitQRR()">
                Valider ma réponse
            </button>

        </div>

        <div class="message" id="message"></div>

    </div>

    <div class="navigation">

        <button
            class="nav-btn"
            id="previousBtn"
            onclick="previousQuestion()">
            ← Précédente
        </button>

        <button
            class="nav-btn"
            id="nextBtn"
            onclick="nextQuestion()">
            Suivante →
        </button>

    </div>

    <div class="end-box" id="endBox">

        <h2>🌑 Boss terminé</h2>

        <p id="endReason">
            Le Boss est terminé.
        </p>

        <p>
            Les réponses QRR sont enregistrées pour correction manuelle.
        </p>

        <a class="back" href="boss.html">
            ← Retour aux Boss
        </a>

    </div>

</div>

<script>

/* =========================================
   RÉCUPÉRATION DU BOSS
   ========================================= */

const urlParams = new URLSearchParams(window.location.search);

const bossChoisi =
    urlParams.get("boss") || "ombres";


/* =========================================
   CONFIGURATION DES BOSS
   ========================================= */

const bossConfigs = {

    ombres: {

        nom: "🌑 Boss des Ombres",
        niveau: "Facile",

        tempsGlobal: 5 * 60,

        tempsQCM: 15,
        tempsQRR: null,

        questions: [

            {
                type: "QCM",
                question: "Quel est le principal objectif du groupe LE ROYAUME DES OMBRES ?",
                answers: [
                    "Organiser des quiz et des défis",
                    "Jouer uniquement à Roblox",
                    "Créer uniquement des vidéos",
                    "Faire uniquement du football"
                ],
                correct: 0
            },

            {
                type: "QCM",
                question: "Combien de minutes dure le temps global d'un Boss ?",
                answers: [
                    "3 minutes",
                    "5 minutes",
                    "7 minutes",
                    "10 minutes"
                ],
                correct: 1
            },

            {
                type: "QCM",
                question: "Quel type de question demande une réponse écrite ?",
                answers: [
                    "QCM",
                    "QRR",
                    "Bonus",
                    "Classement"
                ],
                correct: 1
            },

            {
                type: "QCM",
                question: "Que signifie QCM ?",
                answers: [
                    "Question à choix multiples",
                    "Question à correction manuelle",
                    "Question courte mystère",
                    "Question de classement maximal"
                ],
                correct: 0
            },

            {
                type: "QCM",
                question: "Que devient une réponse QRR après sa validation ?",
                answers: [
                    "Elle est automatiquement notée 100 %",
                    "Elle est automatiquement supprimée",
                    "Elle est enregistrée pour correction",
                    "Elle donne automatiquement un bonus"
                ],
                correct: 2
            }

        ]
    },


    /* =====================================
       🔥 BOSS DES FLAMMES
       ===================================== */

    flammes: {

        nom: "🔥 Boss des Flammes",
        niveau: "Moyen",

        tempsGlobal: 5 * 60,

        tempsQCM: 25,
        tempsQRR: 45,

        questions: [

            {
                type: "QCM",

                question:
                "À Water 7, quel était le métier de Franky avant de devenir officiellement membre de l'équipage de Luffy ?",

                answers: [
                    "Charpentier naval",
                    "Chasseur de primes",
                    "Capitaine corsaire",
                    "Forgeron"
                ],

                correct: 0
            },


            {
                type: "QCM",

                question:
                "Dans Naruto, lequel de ces personnages n'a jamais été Hokage ?",

                answers: [
                    "Minato Namikaze",
                    "Hiruzen Sarutobi",
                    "Jiraiya",
                    "Kakashi Hatake"
                ],

                correct: 2
            },


            {
                type: "QCM",

                question:
                "Avant de devenir Pourfendeur, quel métier Tanjiro exerçait-il principalement avec sa famille ?",

                answers: [
                    "Pêcheur",
                    "Marchand de charbon",
                    "Forgeron",
                    "Cultivateur de riz"
                ],

                correct: 1
            },


            {
                type: "QCM",

                question:
                "Dans Dragon Ball Z, lequel de ces personnages n'est pas un Saiyan ?",

                answers: [
                    "Bardock",
                    "Raditz",
                    "Nappa",
                    "Zarbon"
                ],

                correct: 3
            },


            {
                type: "QCM",

                question:
                "Quelle affirmation décrit correctement les Six Eyes de Satoru Gojo ?",

                answers: [
                    "C'est une technique qui permet de créer des shikigami",
                    "C'est une capacité liée à une perception extrêmement précise de l'énergie occulte",
                    "C'est le nom de son domaine",
                    "C'est une technique permettant de copier toutes les techniques"
                ],

                correct: 1
            },


            {
                type: "QRR",

                question:
                "Dans Bleach, Ichigo possède plusieurs origines liées à ses pouvoirs. Cite les principales origines qui composent son identité spirituelle et explique brièvement comment elles sont liées à ses pouvoirs."
            },


            {
                type: "QRR",

                question:
                "Pourquoi le Gouvernement Mondial considère-t-il Luffy comme une menace particulière ? Donne au moins deux éléments précis liés à son histoire, à ses pouvoirs ou à ses actions."
            }

        ]
    }

};


/* =========================================
   CONFIGURATION ACTIVE
   ========================================= */

const bossConfig =
    bossConfigs[bossChoisi] || bossConfigs.ombres;


/* =========================================
   VARIABLES
   ========================================= */

let currentQuestion = 0;

let globalTime =
    bossConfig.tempsGlobal;

let questionTime =
    bossConfig.tempsQCM;

let globalInterval;
let questionInterval;

let finished = false;

let answersGiven = [];


/* =========================================
   TITRE
   ========================================= */

document.getElementById("bossTitle").textContent =
    bossConfig.nom + " — Niveau " + bossConfig.niveau;


/* =========================================
   AFFICHER QUESTION
   ========================================= */

function showQuestion() {

    if (finished) return;

    clearInterval(questionInterval);

    const q =
        bossConfig.questions[currentQuestion];


    document.getElementById("progress").textContent =
        `Question ${currentQuestion + 1} / ${bossConfig.questions.length}`;


    document.getElementById("questionText").textContent =
        q.question;


    document.getElementById("questionType").textContent =
        q.type;


    const answersContainer =
        document.getElementById("answers");

    const qrrArea =
        document.getElementById("qrrArea");


    const message =
        document.getElementById("message");


    answersContainer.innerHTML = "";

    message.textContent = "";


    qrrArea.style.display = "none";

    answersContainer.style.display = "grid";


    if (q.type === "QCM") {

        questionTime =
            bossConfig.tempsQCM;


        q.answers.forEach((answer, index) => {

            const button =
                document.createElement("button");

            button.className =
                "answer";

            button.textContent =
                answer;

            button.onclick =
                () => selectAnswer(index, button);

            answersContainer.appendChild(button);

        });

    }


    else if (q.type === "QRR") {

        questionTime =
            bossConfig.tempsQRR;

        answersContainer.style.display =
            "none";

        qrrArea.style.display =
            "block";

        document.getElementById("qrrAnswer").value =
            "";

        document.getElementById("qrrAnswer").disabled =
            false;
    }


    document.getElementById("questionTimer").textContent =
        questionTime;


    startQuestionTimer();


    document.getElementById("previousBtn").disabled =
        currentQuestion === 0;


    document.getElementById("nextBtn").disabled =
        currentQuestion ===
        bossConfig.questions.length - 1;
}


/* =========================================
   QCM
   ========================================= */

function selectAnswer(index, button) {

    if (finished) return;


    const buttons =
        document.querySelectorAll(".answer");


    buttons.forEach(btn => {

        btn.classList.remove("selected");

    });


    button.classList.add("selected");


    answersGiven[currentQuestion] = {

        type: "QCM",

        answer: index

    };


    document.getElementById("message").textContent =
        "✅ Réponse enregistrée.";
}


/* =========================================
   QRR
   ========================================= */

function submitQRR() {

    if (finished) return;


    const text =
        document.getElementById("qrrAnswer").value.trim();


    if (text === "") {

        document.getElementById("message").textContent =
            "⚠️ Écris une réponse avant de valider.";

        return;
    }


    answersGiven[currentQuestion] = {

        type: "QRR",

        answer: text,

        statut: "à corriger"

    };


    document.getElementById("message").textContent =
        "✅ Réponse enregistrée — à corriger manuellement.";


    document.getElementById("qrrAnswer").disabled =
        true;
}


/* =========================================
   TIMER GLOBAL
   ========================================= */

function startGlobalTimer() {

    clearInterval(globalInterval);


    globalInterval =
        setInterval(() => {

            globalTime--;

            updateGlobalTimer();


            if (globalTime <= 0) {

                clearInterval(globalInterval);

                finishQuiz(
                    "⏱️ Le temps global de 5 minutes est écoulé."
                );
            }

        }, 1000);
}


/* =========================================
   TIMER QUESTION
   ========================================= */

function startQuestionTimer() {

    clearInterval(questionInterval);


    questionInterval =
        setInterval(() => {

            questionTime--;

            document.getElementById("questionTimer").textContent =
                questionTime;


            if (questionTime <= 0) {

                clearInterval(questionInterval);

                lockQuestion();

            }

        }, 1000);
}


/* =========================================
   VERROUILLAGE
   ========================================= */

function lockQuestion() {

    const buttons =
        document.querySelectorAll(".answer");


    buttons.forEach(button => {

        button.disabled = true;

        button.classList.add("locked");

    });


    document.getElementById("qrrAnswer").disabled =
        true;


    document.getElementById("message").textContent =
        "⏱️ Temps de cette question écoulé.";
}


/* =========================================
   AFFICHAGE TIMER GLOBAL
   ========================================= */

function updateGlobalTimer() {

    const minutes =
        Math.floor(globalTime / 60);

    const seconds =
        globalTime % 60;


    document.getElementById("globalTimer").textContent =
        `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
}


/* =========================================
   QUESTION SUIVANTE
   ========================================= */

function nextQuestion() {

    if (
        currentQuestion <
        bossConfig.questions.length - 1
    ) {

        currentQuestion++;

        showQuestion();

    }

    else {

        finishQuiz(
            "🌑 Toutes les questions ont été traitées."
        );
    }
}


/* =========================================
   QUESTION PRÉCÉDENTE
   ========================================= */

function previousQuestion() {

    if (currentQuestion > 0) {

        currentQuestion--;

        showQuestion();

    }
}


/* =========================================
   FIN DU QUIZ
   ========================================= */

function finishQuiz(reason) {

    if (finished) return;


    finished = true;


    clearInterval(globalInterval);

    clearInterval(questionInterval);


    document.getElementById("quizBox").style.display =
        "none";


    document.querySelector(".navigation").style.display =
        "none";


    document.getElementById("endBox").style.display =
        "block";


    document.getElementById("endReason").textContent =
        reason;
}


/* =========================================
   LANCEMENT
   ========================================= */

updateGlobalTimer();

showQuestion();

startGlobalTimer();

</script>

</body>
</html>
