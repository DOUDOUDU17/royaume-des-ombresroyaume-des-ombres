        }

        /*
         * Les QRR restent à 0 tant qu'elles
         * n'ont pas été corrigées manuellement.
         */

        if (
            answer.type === "QRR" &&
            typeof answer.points === "number"
        ) {

            score += answer.points;

        }

    });

    return score;
}


function updateScoreDisplay() {

    currentScore.textContent =
        calculateCurrentScore();

}


/* =====================================================
   FORMAT TEMPS
   ===================================================== */

function formatTime(seconds) {

    const minutes =
        Math.floor(seconds / 60);

    const secs =
        seconds % 60;

    return String(minutes).padStart(2, "0")
        + ":"
        + String(secs).padStart(2, "0");
}


/* =====================================================
   AFFICHER UNE QUESTION
   ===================================================== */

function showQuestion() {

    if (quizFinished) return;

    clearInterval(questionInterval);

    const q =
        bossConfig.questions[currentQuestion];

    questionLocked = false;

    questionNumber.textContent =
        `Question ${currentQuestion + 1} / ${bossConfig.questions.length}`;

    questionType.textContent =
        q.type;

    questionPoints.textContent =
        `⚔️ ${bossConfig.pointsParReponse} pts`;

    questionText.textContent =
        q.question;

    answersContainer.innerHTML = "";

    qrrArea.classList.add("hidden");

    message.textContent = "";

    progressBar.style.width =
        (
            (currentQuestion + 1) /
            bossConfig.questions.length *
            100
        ) + "%";


    /* =================================================
       QCM
       ================================================= */

    if (q.type === "QCM") {

        q.options.forEach((option, index) => {

            const button =
                document.createElement("button");

            button.className =
                "answer-btn";

            button.textContent =
                String.fromCharCode(65 + index)
                + ". "
                + option;

            button.addEventListener(
                "click",
                function() {

                    selectAnswer(index);

                }
            );

            answersContainer.appendChild(button);

        });


        const savedAnswer =
            answers[currentQuestion];


        if (
            savedAnswer &&
            savedAnswer.type === "QCM"
        ) {

            const buttons =
                document.querySelectorAll(".answer-btn");

            buttons.forEach((button, index) => {

                if (
                    index === savedAnswer.answer
                ) {

                    button.classList.add("selected");

                }

            });


            /*
             * IMPORTANT :
             * La bonne réponse n'est jamais révélée.
             */

            message.textContent =
                "✅ Réponse sélectionnée.";

        }

    }


    /* =================================================
       QRR
       ================================================= */

    else {

        qrrArea.classList.remove("hidden");

        qrrAnswer.disabled = false;

        qrrAnswer.value =
            answers[currentQuestion]?.answer || "";

        qrrSubmit.disabled =
            answers[currentQuestion]?.submitted || false;


        if (
            answers[currentQuestion]?.submitted
        ) {

            message.textContent =
                "📝 Réponse enregistrée — correction manuelle à effectuer.";

        }

    }


    previousBtn.disabled =
        currentQuestion === 0;


    nextBtn.textContent =
        currentQuestion ===
        bossConfig.questions.length - 1

            ? "🏁 Terminer"

            : "Suivante →";


    questionTime =
        q.type === "QCM"
            ? bossConfig.tempsQCM
            : bossConfig.tempsQRR;


    questionTimer.textContent =
        formatTime(questionTime);


    startQuestionTimer();

    updateScoreDisplay();

}


/* =====================================================
   RÉPONSE QCM
   ===================================================== */

function selectAnswer(index) {

    if (
        quizFinished ||
        questionLocked
    ) return;


    const q =
        bossConfig.questions[currentQuestion];


    /*
     * Vérification secrète.
     */

    const estCorrect =
        index === q.correct;


    /*
     * Enregistrement du résultat
     * sans révéler la réponse.
     */

    answers[currentQuestion] = {

        type: "QCM",

        answer: index,

        correct: estCorrect,

        points:
            estCorrect
                ? bossConfig.pointsParReponse
                : 0

    };


    const buttons =
        document.querySelectorAll(".answer-btn");


    buttons.forEach((button, i) => {

        button.classList.toggle(
            "selected",
            i === index
        );

    });


    /*
     * Aucun résultat n'est affiché.
     */

    message.textContent =
        "✅ Réponse sélectionnée.";


    updateScoreDisplay();

}


/* =====================================================
   RÉPONSE QRR
   ===================================================== */

function submitQRR() {

    if (
        quizFinished ||
        questionLocked
    ) return;


    const text =
        qrrAnswer.value.trim();


    if (!text) {

        message.textContent =
            "⚠️ Écris une réponse avant de valider.";

        return;
    }


    answers[currentQuestion] = {

        type: "QRR",

        answer: text,

        submitted: true,

        statut: "à corriger",

        points: null

    };


    qrrSubmit.disabled = true;


    message.textContent =
        "📝 Réponse enregistrée — correction manuelle à effectuer.";

}


/* =====================================================
   TIMER QUESTION
   ===================================================== */

function startQuestionTimer() {

    clearInterval(questionInterval);

    questionInterval =
        setInterval(() => {

            if (
                questionLocked ||
                quizFinished
            ) return;


            questionTime--;

            questionTimer.textContent =
                formatTime(questionTime);


            if (questionTime <= 0) {

                clearInterval(questionInterval);

                lockQuestion();

            }

        }, 1000);
}


/* =====================================================
   BLOQUER QUESTION
   ===================================================== */

function lockQuestion() {

    if (questionLocked) return;

    questionLocked = true;


    const buttons =
        document.querySelectorAll(".answer-btn");


    buttons.forEach(button => {

        button.disabled = true;

        button.classList.add("locked");

    });


    qrrAnswer.disabled = true;

    qrrSubmit.disabled = true;


    message.textContent =
        "⏰ Temps écoulé pour cette question.";
}


/* =====================================================
   TIMER GLOBAL
   ===================================================== */

function startGlobalTimer() {

    globalTimer.textContent =
        formatTime(globalTime);


    globalInterval =
        setInterval(() => {

            if (quizFinished) return;


            globalTime--;

            globalTimer.textContent =
                formatTime(globalTime);


            if (globalTime <= 0) {

                clearInterval(globalInterval);

                finishQuiz(true);

            }

        }, 1000);

}


/* =====================================================
   QUESTION SUIVANTE
   ===================================================== */

function nextQuestion() {

    if (quizFinished) return;


    if (
        currentQuestion <
        bossConfig.questions.length - 1
    ) {

        currentQuestion++;

        showQuestion();

    }

    else {

        finishQuiz(false);

    }

}


/* =====================================================
   QUESTION PRÉCÉDENTE
   ===================================================== */

function previousQuestion() {

    if (quizFinished) return;


    if (currentQuestion > 0) {

        currentQuestion--;

        showQuestion();

    }

}


/* =====================================================
   FIN DU QUIZ
   ===================================================== */

function finishQuiz(timeUp) {

    if (quizFinished) return;


    quizFinished = true;


    clearInterval(globalInterval);

    clearInterval(questionInterval);


    /*
     * SCORE FINAL
     */

    const totalPoints =
        calculateCurrentScore();


    let qcmCorrectes = 0;

    let qrrACorriger = 0;

    let questionsRepondues = 0;


    answers.forEach(answer => {

        if (!answer) return;


        if (answer.type === "QCM") {

            questionsRepondues++;

            if (answer.correct) {

                qcmCorrectes++;

            }

        }


        if (answer.type === "QRR") {

            questionsRepondues++;

            qrrACorriger++;

        }

    });


    /*
     * Maximum théorique du Boss.
     */

    const maximumPossible =
        bossConfig.questions.length *
        bossConfig.pointsParReponse;


    /*
     * Nombre de QRR qui devront encore
     * être corrigées manuellement.
     */

    const pointsQRRMaximum =
        qrrACorriger *
        bossConfig.pointsParReponse;


    quizCard.classList.add("hidden");

    endBox.style.display = "block";


    const titre =
        timeUp
            ? "⏰ Temps écoulé !"
            : "🏁 Boss terminé !";


    /*
     * AFFICHAGE DU SCORE OBTENU
     */

    endMessage.innerHTML = `

        <strong style="font-size:22px;">
            ${titre}
        </strong>

        <div class="score-detail">

            🏆 SCORE OBTENU

            <div class="final-score">
                ${totalPoints} pts
            </div>

        </div>


        <div class="score-detail">

            🎯 MAXIMUM POSSIBLE

            <br>

            <strong>
                ${maximumPossible} pts
            </strong>

        </div>


        <div class="score-detail">

            📊 QUESTIONS RÉPONDUES

            <br>

            <strong>
                ${questionsRepondues}
            </strong>
            /
            ${bossConfig.questions.length}

        </div>


        <div class="score-detail">

            ✅ QCM CORRECTES

            <br>

            <strong>
                ${qcmCorrectes}
            </strong>

        </div>


        <div class="score-detail">

            📝 QRR À CORRIGER

            <br>

            <strong>
                ${qrrACorriger}
            </strong>

        </div>


        ${
            qrrACorriger > 0
                ? `
                    <div class="score-detail">

                        🎯 POINTS QRR ENCORE POSSIBLES

                        <br>

                        <strong>
                            ${pointsQRRMaximum} pts
                        </strong>

                    </div>
                  `
                : ""
        }


        <br>

        ⚔️ Valeur de chaque réponse :

        <strong>
            ${bossConfig.pointsParReponse} pts
        </strong>

        <br><br>

        ${
            qrrACorriger > 0
                ? "📝 Les QRR seront corrigées manuellement."
                : "🔥 Toutes les réponses du Boss ont été traitées."
        }

    `;

}


/* =====================================================
   ÉVÉNEMENTS
   ===================================================== */

previousBtn.addEventListener(
    "click",
    previousQuestion
);


nextBtn.addEventListener(
    "click",
    nextQuestion
);


qrrSubmit.addEventListener(
    "click",
    submitQRR
);


/* =====================================================
   DÉMARRAGE
   ===================================================== */

startGlobalTimer();

showQuestion();

</script>

</body>
</html>
