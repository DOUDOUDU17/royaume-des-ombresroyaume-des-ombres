<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz — Royaume des Ombres</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top, #32105c, #0b0614 55%, #030207);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .quiz-container {
            width: 100%;
            max-width: 800px;
            background: rgba(20, 10, 35, 0.95);
            border: 1px solid #6d2bbf;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 0 35px rgba(110, 40, 200, 0.35);
        }

        .title {
            text-align: center;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .boss-name {
            text-align: center;
            color: #c77dff;
            font-size: 18px;
            margin-bottom: 25px;
        }

        .progress {
            height: 10px;
            background: #241333;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 25px;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #9d4edd;
            transition: width 0.4s;
        }

        .question-number {
            color: #c77dff;
            margin-bottom: 12px;
        }

        .question {
            font-size: 24px;
            line-height: 1.4;
            margin-bottom: 25px;
        }

        .answers {
            display: grid;
            gap: 12px;
        }

        .answer {
            width: 100%;
            padding: 16px;
            border: 1px solid #522080;
            border-radius: 12px;
            background: #160b24;
            color: white;
            text-align: left;
            font-size: 17px;
            cursor: pointer;
            transition: 0.2s;
        }

        .answer:hover {
            background: #291044;
            transform: translateY(-2px);
        }

        .answer.correct {
            background: #174d2b;
            border-color: #36c76f;
        }

        .answer.wrong {
            background: #5a1820;
            border-color: #ff4d6d;
        }

        .info {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            color: #cfc3d9;
        }

        .next-btn {
            display: none;
            margin: 25px auto 0;
            padding: 13px 25px;
            border: none;
            border-radius: 10px;
            background: #8b3dce;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .next-btn:hover {
            background: #a855e8;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #c77dff;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            .quiz-container {
                padding: 20px;
            }

            .title {
                font-size: 26px;
            }

            .question {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="quiz-container">

        <h1 class="title">☠️ QUIZ</h1>

        <p class="boss-name">🌑 Boss des Ombres</p>

        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <p class="question-number" id="questionNumber">
            Question 1 / 5
        </p>

        <h2 class="question" id="question">
            Chargement de la question...
        </h2>

        <div class="answers" id="answers"></div>

        <div class="info">
            <span>⭐ Points : <strong id="score">0</strong></span>
            <span>🔥 Série : <strong id="streak">0</strong></span>
        </div>

        <button class="next-btn" id="nextButton" onclick="nextQuestion()">
            Question suivante ⚔️
        </button>

        <a href="boss.html" class="back">
            ← Retour aux Boss
        </a>

    </div>

    <script>

        const questions = [
            {
                question: "Dans One Piece, comment s'appelle le capitaine de l'équipage au Chapeau de Paille ?",
                answers: [
                    "Monkey D. Luffy",
                    "Roronoa Zoro",
                    "Sanji",
                    "Trafalgar Law"
                ],
                correct: 0
            },

            {
                question: "Dans Naruto, quel est le nom du démon renard scellé en Naruto ?",
                answers: [
                    "Shukaku",
                    "Kurama",
                    "Gyûki",
                    "Matatabi"
                ],
                correct: 1
            },

            {
                question: "Dans Demon Slayer, quelle est la respiration principalement utilisée par Tanjiro au début de son aventure ?",
                answers: [
                    "Respiration de la Foudre",
                    "Respiration du Vent",
                    "Respiration de l'Eau",
                    "Respiration de la Pierre"
                ],
                correct: 2
            },

            {
                question: "Dans Dragon Ball, quel est le nom du héros principal ?",
                answers: [
                    "Vegeta",
                    "Gohan",
                    "Piccolo",
                    "Son Goku"
                ],
                correct: 3
            },

            {
                question: "Dans Bleach, quel est le prénom du personnage principal ?",
                answers: [
                    "Ichigo",
                    "Byakuya",
                    "Renji",
                    "Urahara"
                ],
                correct: 0
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let streak = 0;

        const questionElement = document.getElementById("question");
        const answersElement = document.getElementById("answers");
        const questionNumberElement = document.getElementById("questionNumber");
        const scoreElement = document.getElementById("score");
        const streakElement = document.getElementById("streak");
        const nextButton = document.getElementById("nextButton");
        const progressBar = document.getElementById("progressBar");

        function showQuestion() {

            const question = questions[currentQuestion];

            questionElement.textContent = question.question;

            questionNumberElement.textContent =
                `Question ${currentQuestion + 1} / ${questions.length}`;

            answersElement.innerHTML = "";

            nextButton.style.display = "none";

            progressBar.style.width =
                `${((currentQuestion) / questions.length) * 100}%`;

            question.answers.forEach((answer, index) => {

                const button = document.createElement("button");

                button.className = "answer";
                button.textContent = answer;

                button.onclick = () => checkAnswer(index, button);

                answersElement.appendChild(button);
            });
        }

        function checkAnswer(selected, selectedButton) {

            const question = questions[currentQuestion];

            const buttons = document.querySelectorAll(".answer");

            buttons.forEach(button => {
                button.disabled = true;
            });

            if (selected === question.correct) {

                selectedButton.classList.add("correct");

                score += 100;
                streak++;

            } else {

                selectedButton.classList.add("wrong");

                buttons[question.correct].classList.add("correct");

                streak = 0;
            }

            scoreElement.textContent = score;
            streakElement.textContent = streak;

            nextButton.style.display = "block";
        }

        function nextQuestion() {

            currentQuestion++;

            if (currentQuestion < questions.length) {

                showQuestion();

            } else {

                finishQuiz();
            }
        }

        function finishQuiz() {

            progressBar.style.width = "100%";

            questionNumberElement.textContent = "👑 Boss terminé";

            questionElement.textContent =
                `Félicitations ! Tu as obtenu ${score} points.`;

            answersElement.innerHTML = "";

            nextButton.style.display = "none";
        }

        showQuestion();

    </script>

</body>
</html>
